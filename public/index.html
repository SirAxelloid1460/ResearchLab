<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResearchLab</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f0e6;
  --paper: #faf7f1;
  --ink: #1c1814;
  --rule: #d8d3c8;
  --muted: #8c877e;
  --accent: #c94f2c;
  --blue: #2563c4;
  --green: #1a9e5c;
  --amber: #d4820f;
  --surface: #fff;
  --shadow: 0 2px 8px rgba(28,24,20,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); font-family:'Fira Code',monospace; color:var(--ink); min-height:100vh; }
body::after { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events:none; z-index:9999; }

/* TYPOGRAPHY */
.syne { font-family:'Syne',sans-serif; }
.mono { font-family:'Fira Code',monospace; }

/* LAYOUT */
.app { display:flex; flex-direction:column; min-height:100vh; }

/* HEADER */
.header {
  background:var(--paper);
  border-bottom:2px solid var(--ink);
  padding:.8rem 1.6rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
}
.logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.25rem; letter-spacing:-.03em; }
.logo span { color:var(--accent); }
.header-right { display:flex; align-items:center; gap:.8rem; }
.avatar { width:32px; height:32px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font-size:.65rem; font-weight:700; font-family:'Syne',sans-serif; cursor:pointer; }
.btn { font-family:'Fira Code',monospace; font-size:.72rem; padding:.5rem 1rem; border-radius:4px; cursor:pointer; transition:all .15s; border:1.5px solid; letter-spacing:.03em; }
.btn-primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.btn-primary:hover { background:var(--accent); border-color:var(--accent); }
.btn-ghost { background:transparent; color:var(--muted); border-color:var(--rule); }
.btn-ghost:hover { border-color:var(--ink); color:var(--ink); }
.btn-danger { background:transparent; color:#c94f2c; border-color:rgba(201,79,44,.3); }
.btn-danger:hover { background:rgba(201,79,44,.07); }
.btn:disabled { opacity:.4; cursor:not-allowed; }

/* AUTH PAGE */
.auth-page { min-height:100vh; display:grid; place-items:center; padding:2rem; }
.auth-card { background:var(--surface); border:2px solid var(--ink); border-radius:8px; padding:2.5rem; width:100%; max-width:420px; box-shadow:4px 4px 0 var(--ink); }
.auth-title { font-family:'Syne',sans-serif; font-weight:800; font-size:2rem; letter-spacing:-.04em; margin-bottom:.3rem; }
.auth-title span { color:var(--accent); }
.auth-sub { font-size:.68rem; color:var(--muted); margin-bottom:2rem; letter-spacing:.05em; }
.field { margin-bottom:1rem; }
.field label { display:block; font-size:.6rem; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); margin-bottom:.35rem; }
.field input { width:100%; background:var(--bg); border:1.5px solid var(--rule); color:var(--ink); padding:.65rem .9rem; font-family:'Fira Code',monospace; font-size:.78rem; border-radius:4px; outline:none; transition:border-color .15s; }
.field input:focus { border-color:var(--ink); }
.divider { display:flex; align-items:center; gap:.8rem; margin:1.2rem 0; color:var(--muted); font-size:.6rem; letter-spacing:.1em; }
.divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--rule); }
.oauth-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-bottom:1.2rem; }
.oauth-btn { background:var(--bg); border:1.5px solid var(--rule); padding:.55rem; border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.5rem; font-family:'Fira Code',monospace; font-size:.65rem; color:var(--ink); transition:all .15s; }
.oauth-btn:hover { border-color:var(--ink); background:var(--paper); }
.oauth-btn svg { width:16px; height:16px; flex-shrink:0; }
.auth-toggle { text-align:center; margin-top:1rem; font-size:.65rem; color:var(--muted); }
.auth-toggle button { background:none; border:none; color:var(--accent); cursor:pointer; font-family:'Fira Code',monospace; font-size:.65rem; text-decoration:underline; }
.error-msg { background:rgba(201,79,44,.08); border:1px solid rgba(201,79,44,.25); color:var(--accent); padding:.6rem .8rem; border-radius:4px; font-size:.68rem; margin-bottom:.8rem; }
.success-msg { background:rgba(26,158,92,.08); border:1px solid rgba(26,158,92,.25); color:var(--green); padding:.6rem .8rem; border-radius:4px; font-size:.68rem; margin-bottom:.8rem; }

/* DASHBOARD */
.dashboard { flex:1; padding:2rem; max-width:1100px; margin:0 auto; width:100%; }
.page-header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:2rem; flex-wrap:wrap; gap:1rem; }
.page-title { font-family:'Syne',sans-serif; font-weight:800; font-size:1.8rem; letter-spacing:-.03em; }
.page-title span { color:var(--accent); }
.projects-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:4px; overflow:hidden; }
.project-card { background:var(--paper); padding:1.4rem 1.6rem; cursor:pointer; transition:background .15s; position:relative; }
.project-card:hover { background:var(--surface); }
.project-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.7rem; }
.project-name { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; line-height:1.2; flex:1; padding-right:.5rem; }
.project-meta { font-size:.6rem; color:var(--muted); letter-spacing:.05em; margin-bottom:.7rem; }
.project-stats { display:flex; gap:1rem; }
.stat-badge { font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; padding:.2rem .5rem; border-radius:2px; border:1px solid; }
.stat-inv { background:rgba(37,99,196,.08); color:var(--blue); border-color:rgba(37,99,196,.2); }
.stat-calc { background:rgba(212,130,15,.08); color:var(--amber); border-color:rgba(212,130,15,.2); }
.new-project-card { background:var(--bg); padding:1.4rem 1.6rem; cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:.7rem; color:var(--muted); font-size:.72rem; border:2px dashed var(--rule); border-radius:0; }
.new-project-card:hover { color:var(--ink); border-color:var(--muted); background:var(--paper); }
.empty-state { text-align:center; padding:4rem 2rem; color:var(--muted); }
.empty-state .big { font-family:'Syne',sans-serif; font-size:2.5rem; margin-bottom:1rem; opacity:.3; }
.empty-state p { font-size:.75rem; margin-bottom:1.5rem; }

/* PROJECT PAGE */
.project-page { flex:1; display:flex; flex-direction:column; }
.project-header { background:var(--paper); border-bottom:2px solid var(--ink); padding:1rem 1.6rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
.breadcrumb { display:flex; align-items:center; gap:.5rem; font-size:.65rem; color:var(--muted); }
.breadcrumb button { background:none; border:none; color:var(--accent); cursor:pointer; font-family:'Fira Code',monospace; font-size:.65rem; text-decoration:underline; }
.breadcrumb span { opacity:.5; }
.project-title-area { flex:1; }
.project-page-title { font-family:'Syne',sans-serif; font-weight:800; font-size:1.3rem; letter-spacing:-.02em; }
.project-desc { font-size:.62rem; color:var(--muted); margin-top:.2rem; }
.tabs { display:flex; border-bottom:2px solid var(--rule); background:var(--paper); padding:0 1.6rem; }
.tab { padding:.7rem 1.2rem; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; color:var(--muted); transition:all .15s; background:none; border-left:none; border-right:none; border-top:none; font-family:'Fira Code',monospace; }
.tab.active { color:var(--ink); border-bottom-color:var(--ink); }
.tab:hover:not(.active) { color:var(--ink); }
.tab-content { flex:1; overflow-y:auto; padding:1.5rem 1.6rem; }

/* INVESTIGATIONS */
.inv-list { display:flex; flex-direction:column; gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:4px; overflow:hidden; margin-bottom:1rem; }
.inv-item { background:var(--paper); padding:1rem 1.3rem; cursor:pointer; transition:background .15s; display:flex; align-items:flex-start; gap:1rem; }
.inv-item:hover { background:var(--surface); }
.inv-item-main { flex:1; }
.inv-topic { font-family:'Syne',sans-serif; font-weight:700; font-size:.9rem; margin-bottom:.3rem; }
.inv-preview { font-size:.63rem; color:var(--muted); line-height:1.5; }
.inv-date { font-size:.58rem; color:var(--muted); white-space:nowrap; }
.inv-status { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:4px; }
.status-done { background:var(--green); }
.status-wip { background:var(--amber); }

/* INVESTIGATION CHAT */
.inv-chat { display:flex; flex-direction:column; height:calc(100vh - 280px); }
.inv-chat-header { display:flex; align-items:center; gap:.8rem; padding-bottom:1rem; border-bottom:1px solid var(--rule); margin-bottom:1rem; }
.back-btn { background:none; border:1px solid var(--rule); color:var(--muted); padding:.35rem .7rem; border-radius:3px; cursor:pointer; font-size:.62rem; font-family:'Fira Code',monospace; transition:all .15s; }
.back-btn:hover { border-color:var(--ink); color:var(--ink); }
.inv-chat-title { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; flex:1; }
.messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:1rem; padding-right:.5rem; }
.msg { display:flex; flex-direction:column; gap:.25rem; max-width:700px; animation:msgIn .25s ease; }
@keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.msg.user { align-self:flex-end; align-items:flex-end; }
.msg.ai { align-self:flex-start; }
.msg-lbl { font-size:.52rem; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); padding:0 .3rem; }
.msg-bubble { padding:.8rem 1.1rem; border-radius:4px; font-size:.73rem; line-height:1.75; }
.msg.user .msg-bubble { background:var(--ink); color:var(--bg); border-radius:4px 4px 2px 4px; }
.msg.ai .msg-bubble { background:var(--surface); border:1px solid var(--rule); border-radius:4px 4px 4px 2px; }
.msg.ai .msg-bubble h3 { font-family:'Syne',sans-serif; font-size:.8rem; font-weight:700; color:var(--accent); border-bottom:1px solid var(--rule); padding-bottom:.25rem; margin:.8rem 0 .4rem; }
.msg.ai .msg-bubble h3:first-child { margin-top:0; }
.msg.ai .msg-bubble strong { color:var(--accent); }
.msg.ai .msg-bubble table { width:100%; border-collapse:collapse; font-size:.65rem; margin:.7rem 0; }
.msg.ai .msg-bubble th { background:var(--ink); color:var(--bg); padding:.35rem .6rem; text-align:left; font-family:'Syne',sans-serif; font-size:.58rem; letter-spacing:.08em; text-transform:uppercase; }
.msg.ai .msg-bubble td { padding:.3rem .6rem; border-bottom:1px solid var(--rule); }
.msg.ai .msg-bubble tr:nth-child(even) td { background:var(--bg); }
.msg.ai .msg-bubble p { margin-bottom:.45rem; }
.msg.ai .msg-bubble p:last-child { margin-bottom:0; }
.msg.ai .msg-bubble ul, .msg.ai .msg-bubble ol { padding-left:1.2rem; margin:.4rem 0; }
.msg.ai .msg-bubble li { margin-bottom:.2rem; }
.msg.ai .msg-bubble code { background:var(--bg); padding:.1rem .3rem; border-radius:2px; font-size:.68rem; border:1px solid var(--rule); }
.thinking { display:flex; align-items:center; gap:.5rem; padding:.6rem .9rem; background:var(--surface); border:1px solid var(--rule); border-radius:4px; font-size:.62rem; color:var(--muted); width:fit-content; }
.dots { display:flex; gap:3px; }
.dot { width:5px; height:5px; border-radius:50%; background:var(--accent); animation:bounce 1.2s infinite; }
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.chat-input-area { margin-top:1rem; padding-top:1rem; border-top:1px solid var(--rule); }
.chat-input-row { display:flex; gap:.6rem; align-items:flex-end; }
.chat-input-row textarea { flex:1; background:var(--bg); border:1.5px solid var(--rule); color:var(--ink); padding:.65rem .9rem; font-family:'Fira Code',monospace; font-size:.73rem; border-radius:4px; outline:none; resize:none; transition:border-color .15s; line-height:1.5; min-height:42px; max-height:150px; }
.chat-input-row textarea:focus { border-color:var(--ink); }

/* CALCULATIONS */
.calc-layout { display:grid; grid-template-columns:1fr 320px; gap:1.5rem; align-items:start; }
@media(max-width:768px){ .calc-layout{grid-template-columns:1fr} }
.calc-panel { background:var(--surface); border:1.5px solid var(--rule); border-radius:6px; overflow:hidden; }
.calc-panel-header { padding:.8rem 1.1rem; background:var(--ink); color:var(--bg); }
.calc-panel-title { font-family:'Syne',sans-serif; font-weight:700; font-size:.82rem; }
.calc-panel-sub { font-size:.58rem; opacity:.6; margin-top:.15rem; }
.calc-panel-body { padding:1.1rem; }
.calc-textarea { width:100%; background:var(--bg); border:1.5px solid var(--rule); color:var(--ink); padding:.7rem .9rem; font-family:'Fira Code',monospace; font-size:.73rem; border-radius:4px; outline:none; resize:vertical; min-height:90px; line-height:1.6; transition:border-color .15s; }
.calc-textarea:focus { border-color:var(--ink); }
.data-source-list { display:flex; flex-direction:column; gap:.5rem; }
.data-source-item { display:flex; align-items:center; gap:.6rem; padding:.6rem .8rem; background:var(--bg); border:1px solid var(--rule); border-radius:3px; font-size:.65rem; cursor:pointer; transition:all .15s; }
.data-source-item.selected { border-color:var(--blue); background:rgba(37,99,196,.06); }
.data-source-item .ds-check { width:14px; height:14px; border:1.5px solid var(--rule); border-radius:2px; flex-shrink:0; display:grid; place-items:center; font-size:.6rem; }
.data-source-item.selected .ds-check { background:var(--blue); border-color:var(--blue); color:white; }
.ds-name { flex:1; font-family:'Syne',sans-serif; font-weight:600; font-size:.65rem; }
.ds-preview { font-size:.58rem; color:var(--muted); }
.calc-type-grid { display:grid; grid-template-columns:1fr 1fr; gap:.4rem; margin:.6rem 0; }
.calc-type-btn { background:var(--bg); border:1.5px solid var(--rule); color:var(--muted); padding:.5rem .6rem; border-radius:3px; cursor:pointer; font-size:.6rem; letter-spacing:.06em; text-transform:uppercase; font-family:'Fira Code',monospace; transition:all .15s; text-align:center; }
.calc-type-btn.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.calc-result { background:var(--surface); border:1.5px solid var(--rule); border-radius:6px; overflow:hidden; margin-top:1rem; }
.calc-result-header { padding:.7rem 1rem; background:var(--bg); border-bottom:1px solid var(--rule); font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:.5rem; }
.calc-result-header .dot-green { width:7px; height:7px; border-radius:50%; background:var(--green); }
.calc-result-body { padding:1rem; font-size:.73rem; line-height:1.75; }
.calc-result-body h3 { font-family:'Syne',sans-serif; font-size:.8rem; font-weight:700; color:var(--accent); margin:.7rem 0 .35rem; }
.calc-result-body h3:first-child { margin-top:0; }
.calc-result-body strong { color:var(--accent); }
.calc-result-body table { width:100%; border-collapse:collapse; font-size:.64rem; margin:.6rem 0; }
.calc-result-body th { background:var(--ink); color:var(--bg); padding:.3rem .5rem; text-align:left; font-family:'Syne',sans-serif; font-size:.57rem; letter-spacing:.08em; text-transform:uppercase; }
.calc-result-body td { padding:.28rem .5rem; border-bottom:1px solid var(--rule); }
.calc-result-body tr:nth-child(even) td { background:var(--bg); }
.calc-result-body p { margin-bottom:.4rem; }
.calc-result-body ul { padding-left:1.1rem; margin:.3rem 0; }
.calc-result-body li { margin-bottom:.2rem; }
.calc-result-body code { background:var(--bg); padding:.1rem .25rem; border-radius:2px; font-size:.67rem; border:1px solid var(--rule); }
.inline-chart { display:flex; flex-direction:column; gap:.4rem; margin:.7rem 0; }
.chart-row { display:flex; align-items:center; gap:.6rem; font-size:.62rem; }
.chart-lbl { width:120px; flex-shrink:0; color:var(--muted); }
.chart-bar-wrap { flex:1; height:14px; background:var(--bg); border:1px solid var(--rule); border-radius:2px; overflow:hidden; }
.chart-bar { height:100%; transition:width 1s cubic-bezier(.34,1.2,.64,1); }
.chart-val { width:50px; text-align:right; font-weight:500; }

/* MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(28,24,20,.6); backdrop-filter:blur(3px); z-index:1000; display:grid; place-items:center; padding:1rem; }
.modal { background:var(--surface); border:2px solid var(--ink); border-radius:6px; padding:1.8rem; width:100%; max-width:480px; box-shadow:4px 4px 0 var(--ink); animation:modalIn .25s cubic-bezier(.34,1.2,.64,1); }
@keyframes modalIn{from{transform:scale(.93) translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal-title { font-family:'Syne',sans-serif; font-weight:800; font-size:1.3rem; letter-spacing:-.02em; margin-bottom:.3rem; }
.modal-sub { font-size:.62rem; color:var(--muted); margin-bottom:1.4rem; }
.modal-actions { display:flex; gap:.6rem; justify-content:flex-end; margin-top:1.4rem; }

/* MISC */
.tag { display:inline-flex; align-items:center; gap:.3rem; font-size:.55rem; letter-spacing:.1em; text-transform:uppercase; padding:.18rem .45rem; border-radius:2px; border:1px solid; }
.tag-inv { background:rgba(37,99,196,.07); color:var(--blue); border-color:rgba(37,99,196,.2); }
.tag-calc { background:rgba(212,130,15,.07); color:var(--amber); border-color:rgba(212,130,15,.2); }
.spinner { width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}

/* SETUP NOTICE */
.setup-notice { background:rgba(212,130,15,.08); border:1px solid rgba(212,130,15,.3); border-radius:6px; padding:1rem 1.2rem; margin-bottom:1.5rem; font-size:.68rem; }
.setup-notice strong { color:var(--amber); font-family:'Syne',sans-serif; }
.setup-notice code { background:var(--bg); padding:.1rem .3rem; border-radius:2px; font-size:.66rem; border:1px solid var(--rule); }
.setup-notice ul { padding-left:1.1rem; margin:.5rem 0; }
.setup-notice li { margin-bottom:.25rem; }
</style>
</head>

const { useState, useEffect, useRef, useCallback } = React;

const SUPABASE_URL = 'https://lkvkplvmilhequqswxsp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oU7n1cAVs2YiFbTIIxz3gg_rHCFZLkr';

    created_at: new Date(Date.now()-86400000*3).toISOString(),

// ── HELPERS ──────────────────────────────────────────────────────────────────
function parseMarkdown(text) {
  let h = text;
  h = h.replace(/\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)+)/g, (_, hd, rows) => {
    const ths = hd.split('|').filter(Boolean).map(c=>`<th>${c.trim()}</th>`).join('');
    const trs = rows.trim().split('\n').map(r=>{
      const tds = r.split('|').filter(Boolean).map(c=>`<td>${c.trim()}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  });
  h = h.replace(/\[CHART:([^\|]+)\|([^\]]+)\]/g, (_,title,data)=>{
    const pairs = data.split(',').map(p=>{ const [l,v]=p.split(':'); return {l:l?.trim(),v:parseFloat(v)||0}; });
    const mx = Math.max(...pairs.map(p=>p.v));
    const COLORS=['#c94f2c','#2563c4','#1a9e5c','#d4820f','#8b2cc9'];
    const rows = pairs.map((p,i)=>`<div class="chart-row"><span class="chart-lbl">${p.l}</span><div class="chart-bar-wrap"><div class="chart-bar" style="width:${mx?p.v/mx*100:0}%;background:${COLORS[i%COLORS.length]}"></div></div><span class="chart-val">${p.v.toLocaleString('es')}</span></div>`).join('');
    return `<div style="margin:.8rem 0"><div style="font-family:Syne,sans-serif;font-weight:700;font-size:.75rem;color:var(--accent);margin-bottom:.4rem">${title}</div><div class="inline-chart">${rows}</div></div>`;
  });
  h = h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h = h.replace(/^### (.+)$/gm,'<h4 style="font-family:Syne,sans-serif;font-size:.75rem;font-weight:700;margin:.6rem 0 .2rem;color:var(--blue)">$1</h4>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/^[-•*] (.+)$/gm,'<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
  h = h.split('\n\n').map(b=>b.startsWith('<')?b:`<p>${b.replace(/\n/g,'<br>')}</p>`).join('');
  return h;
}

function fmt(dateStr) {
  return new Date(dateStr).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});
}

// ── CLAUDE API CALL ──────────────────────────────────────────────────────────
async function callClaude(messages, systemPrompt) {
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:1000,
      system: systemPrompt,
      tools:[{type:'web_search_20250305',name:'web_search'}],
      messages
    })
  });
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  return text || 'No se obtuvo respuesta.';
}

// ── INVESTIGATION CHAT ────────────────────────────────────────────────────────
function InvestigationChat({ inv, onBack, onUpdate }) {
  const [messages, setMessages] = useState(inv.messages || []);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const messagesRef = useRef(null);
  const taRef = useRef(null);

  useEffect(()=>{ if(messagesRef.current) messagesRef.current.scrollTop=messagesRef.current.scrollHeight; },[messages,loading]);

  function resize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,150)+'px'; }

  async function send() {
    if(!input.trim()||loading) return;
    const userMsg = {role:'user',content:input.trim()};
    const newMsgs = [...messages, userMsg];
    setMessages(newMsgs); setInput(''); setLoading(true);
    if(taRef.current) { taRef.current.style.height='42px'; }
    const system = `Eres ResearchLab, un asistente de investigación científica y análisis de datos. 
Respondes SIEMPRE en español. Eres preciso, citas fuentes (Banco Mundial, ONU, FMI, NASA, etc.).
Usa formato Markdown: ## para secciones, **negrita** para datos clave, tablas para comparativas.
Al final incluye "## 💡 Conclusiones clave" con los hallazgos más importantes.
Para gráficos usa: [CHART:titulo|etiqueta:valor,etiqueta:valor]
La investigación actual es sobre: "${inv.topic}"`;
    try {
      const reply = await callClaude(newMsgs, system);
      const finalMsgs = [...newMsgs, {role:'assistant',content:reply}];
      setMessages(finalMsgs);
      onUpdate(inv.id, finalMsgs, reply.slice(0,120)+'…');
    } catch(e) {
      const err = [...newMsgs,{role:'assistant',content:`❌ Error: ${e.message}`}];
      setMessages(err);
    }
    setLoading(false);
  }

  return (
    <div className="inv-chat">
      <div className="inv-chat-header">
        <button className="back-btn" onClick={onBack}>← Volver</button>
        <div className="inv-chat-title">{inv.topic}</div>
        <span className="tag tag-inv">Investigación</span>
      </div>
      <div className="messages" ref={messagesRef}>
        {messages.map((m,i)=>(
          <div key={i} className={`msg ${m.role==='user'?'user':'ai'}`}>
            <span className="msg-lbl">{m.role==='user'?'Tú':'ResearchLab IA'}</span>
            {m.role==='user'
              ? <div className="msg-bubble">{m.content}</div>
              : <div className="msg-bubble" dangerouslySetInnerHTML={{__html:parseMarkdown(m.content)}}/>
            }
          </div>
        ))}
        {loading && (
          <div className="msg ai">
            <span className="msg-lbl">ResearchLab IA</span>
            <div className="thinking"><div className="dots"><div className="dot"/><div className="dot"/><div className="dot"/></div>Investigando…</div>
          </div>
        )}
      </div>
      <div className="chat-input-area">
        <div className="chat-input-row">
          <textarea ref={taRef} value={input} onChange={e=>{setInput(e.target.value);resize(e.target);}} onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }} placeholder="Pregunta algo o pide un análisis más profundo…" rows={1}/>
          <button className="btn btn-primary" onClick={send} disabled={loading||!input.trim()}>{loading?<span className="spinner"/>:'↑ Enviar'}</button>
        </div>
      </div>
    </div>
  );
}

// ── CALCULATIONS TAB ──────────────────────────────────────────────────────────
function CalculationsTab({ project, onSaveCalc }) {
  const [selectedSources, setSelectedSources] = useState([]);
  const [calcType, setCalcType] = useState('cross');
  const [prompt, setPrompt] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [saved, setSaved] = useState(project.calculations || []);
  const [viewCalc, setViewCalc] = useState(null);

  const TYPES = [
    {id:'cross', label:'Cruzar datos'},
    {id:'projection', label:'Proyección'},
    {id:'correlation', label:'Correlación'},
    {id:'formula', label:'Fórmula propia'},
  ];

  function toggleSource(id) {
    setSelectedSources(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  }

  async function runCalc() {
    if(!prompt.trim()) return;
    setLoading(true); setResult(null);
    const sources = project.investigations.filter(i=>selectedSources.includes(i.id));
    const dataContext = sources.map(s=>{
      const lastAI = [...s.messages].reverse().find(m=>m.role==='assistant');
      return `### Investigación: "${s.topic}"\nResumen: ${s.summary||'(sin resumen)'}\nÚltimos datos:\n${lastAI?.content?.slice(0,800)||'Sin datos aún'}`;
    }).join('\n\n---\n\n');
    const typeLabels = {cross:'cruce de datos entre fuentes',projection:'proyección de tendencias',correlation:'análisis de correlación estadística',formula:'cálculo con fórmula personalizada'};
    const system = `Eres ResearchLab, motor de cálculo y análisis. SIEMPRE respondes en español.
Usa Markdown avanzado: ## secciones, tablas, **negrita**, [CHART:titulo|etiqueta:valor,...] para gráficos.
Realiza un ${typeLabels[calcType]} riguroso y cita metodología.
Al final siempre incluye "## 💡 Conclusiones clave" y "## ⚠ Limitaciones" brevemente.
${dataContext ? `\n\n## Datos disponibles de las investigaciones seleccionadas:\n${dataContext}` : ''}`;
    try {
      const reply = await callClaude([{role:'user',content:prompt}], system);
      setResult(reply);
    } catch(e) { setResult(`❌ Error: ${e.message}`); }
    setLoading(false);
  }

  async function saveCalc() {
    if(!result) return;
    const calc = await onSaveCalc(
      prompt.slice(0,60), calcType, prompt, result, selectedSources
    );
    if(calc) {
      setSaved(s=>[calc,...s]);
      setResult(null); setPrompt(''); setSelectedSources([]);
    }
  }

  if(viewCalc) return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:'.8rem',marginBottom:'1.2rem'}}>
        <button className="back-btn" onClick={()=>setViewCalc(null)}>← Volver</button>
        <span style={{fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:'.95rem',flex:1}}>{viewCalc.title}</span>
        <span className="tag tag-calc">{viewCalc.type}</span>
      </div>
      <div className="calc-result">
        <div className="calc-result-header"><div className="dot-green"/>{new Date(viewCalc.created_at).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}</div>
        <div className="calc-result-body" dangerouslySetInnerHTML={{__html:parseMarkdown(viewCalc.result)}}/>
      </div>
    </div>
  );

  return (
    <div>
      {saved.length>0&&(
        <div style={{marginBottom:'1.5rem'}}>
          <div style={{fontSize:'.58rem',letterSpacing:'.15em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'.6rem'}}>Calculaciones guardadas</div>
          <div className="inv-list">
            {saved.map(c=>(
              <div key={c.id} className="inv-item" onClick={()=>setViewCalc(c)}>
                <div className="inv-status status-done"/>
                <div className="inv-item-main">
                  <div className="inv-topic">{c.title}</div>
                  <div className="inv-preview" style={{display:'flex',gap:'.5rem',marginTop:'.3rem',alignItems:'center'}}>
                    <span className="tag tag-calc">{c.type}</span>
                    <span>{fmt(c.created_at)}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
      <div className="calc-layout">
        <div>
          <div style={{fontSize:'.58rem',letterSpacing:'.15em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'.6rem'}}>Nueva calculación</div>
          <div className="calc-panel">
            <div className="calc-panel-header">
              <div className="calc-panel-title">Motor de Análisis IA</div>
              <div className="calc-panel-sub">Interrelaciona datos de tus investigaciones</div>
            </div>
            <div className="calc-panel-body">
              <div style={{fontSize:'.58rem',letterSpacing:'.12em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'.4rem'}}>Tipo de análisis</div>
              <div className="calc-type-grid">
                {TYPES.map(t=><button key={t.id} className={`calc-type-btn${calcType===t.id?' active':''}`} onClick={()=>setCalcType(t.id)}>{t.label}</button>)}
              </div>
              <div style={{fontSize:'.58rem',letterSpacing:'.12em',textTransform:'uppercase',color:'var(--muted)',margin:'.8rem 0 .4rem'}}>Qué quieres calcular o analizar</div>
              <textarea className="calc-textarea" value={prompt} onChange={e=>setPrompt(e.target.value)} placeholder={
                calcType==='cross'?'Ej: Cruza los datos de esperanza de vida con el PIB per cápita y encuentra patrones…':
                calcType==='projection'?'Ej: Proyecta la tasa de envejecimiento de España para 2030 y 2040 basándote en las tendencias actuales…':
                calcType==='correlation'?'Ej: ¿Existe correlación entre el gasto sanitario y la longevidad? Calcula el coeficiente de correlación…':
                'Ej: Calcula el ratio de dependencia demográfica usando la fórmula (menores+mayores)/laborales×100…'
              }/>
              <button className="btn btn-primary" style={{width:'100%',marginTop:'.7rem',padding:'.65rem'}} onClick={runCalc} disabled={loading||!prompt.trim()}>
                {loading?<span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'.5rem'}}><span className="spinner"/>Calculando…</span>:'⚡ Ejecutar análisis'}
              </button>
            </div>
          </div>
          {result&&(
            <div className="calc-result" style={{marginTop:'1rem'}}>
              <div className="calc-result-header"><div className="dot-green"/>Resultado listo</div>
              <div className="calc-result-body" dangerouslySetInnerHTML={{__html:parseMarkdown(result)}}/>
              <div style={{padding:'.8rem 1rem',borderTop:'1px solid var(--rule)',display:'flex',gap:'.5rem',justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setResult(null)}>Descartar</button>
                <button className="btn btn-primary" onClick={saveCalc}>Guardar calculación</button>
              </div>
            </div>
          )}
        </div>
        <div>
          <div style={{fontSize:'.58rem',letterSpacing:'.12em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'.6rem'}}>Fuentes de datos ({project.investigations.length})</div>
          {project.investigations.length===0?(
            <div style={{background:'var(--bg)',border:'1px dashed var(--rule)',borderRadius:4,padding:'1.5rem',textAlign:'center',fontSize:'.68rem',color:'var(--muted)'}}>
              Añade investigaciones al proyecto para poder cruzar sus datos aquí
            </div>
          ):(
            <div className="data-source-list">
              {project.investigations.map(inv=>(
                <div key={inv.id} className={`data-source-item${selectedSources.includes(inv.id)?' selected':''}`} onClick={()=>toggleSource(inv.id)}>
                  <div className="ds-check">{selectedSources.includes(inv.id)&&'✓'}</div>
                  <div style={{flex:1}}>
                    <div className="ds-name">{inv.topic}</div>
                    <div className="ds-preview">{inv.messages?.length||0} mensajes · {fmt(inv.created_at)}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
          {selectedSources.length>0&&<div style={{marginTop:'.6rem',fontSize:'.6rem',color:'var(--green)'}}>✓ {selectedSources.length} fuente{selectedSources.length>1?'s':''} seleccionada{selectedSources.length>1?'s':''}</div>}
        </div>
      </div>
    </div>
  );
}

// ── SUPABASE DATA LAYER ───────────────────────────────────────────────────────
async function dbLoadProjects(userId) {
  const { data: projects, error } = await supabase
    .from('projects').select('*').eq('user_id', userId).order('created_at', { ascending: false });
  if (error) throw error;
  const full = await Promise.all(projects.map(async p => {
    const [{ data: investigations }, { data: calculations }] = await Promise.all([
      supabase.from('investigations').select('*').eq('project_id', p.id).order('created_at', { ascending: false }),
      supabase.from('calculations').select('*').eq('project_id', p.id).order('created_at', { ascending: false }),
    ]);
    return { ...p, investigations: investigations||[], calculations: calculations||[] };
  }));
  return full;
}
async function dbCreateProject(userId, name, description) {
  const { data, error } = await supabase.from('projects')
    .insert({ user_id: userId, name, description }).select().single();
  if (error) throw error;
  return { ...data, investigations:[], calculations:[] };
}
async function dbCreateInvestigation(userId, projectId, topic, messages) {
  const { data, error } = await supabase.from('investigations')
    .insert({ user_id: userId, project_id: projectId, topic, messages, summary:'Nueva investigación' }).select().single();
  if (error) throw error;
  return data;
}
async function dbUpdateInvestigation(invId, messages, summary) {
  const { error } = await supabase.from('investigations')
    .update({ messages, summary }).eq('id', invId);
  if (error) throw error;
}
async function dbCreateCalculation(userId, projectId, title, type, prompt, result, sources) {
  const { data, error } = await supabase.from('calculations')
    .insert({ user_id: userId, project_id: projectId, title, type, prompt, result, sources }).select().single();
  if (error) throw error;
  return data;
}

// ── PROJECT PAGE ──────────────────────────────────────────────────────────────
function ProjectPage({ project, onBack, onUpdate, onCreateInv, onUpdateInv, onCreateCalc }) {
  const [tab, setTab] = useState('investigations');
  const [showNewInv, setShowNewInv] = useState(false);
  const [activeInv, setActiveInv] = useState(null);
  const [proj, setProj] = useState(project);
  const [saving, setSaving] = useState(false);

  async function createInvestigation(topic, firstQ) {
    setSaving(true);
    const msgs = firstQ ? [{role:'user',content:firstQ}] : [];
    try {
      const inv = await onCreateInv(proj.id, topic, msgs);
      const updated = { ...proj, investigations:[inv,...(proj.investigations||[])] };
      setProj(updated); onUpdate(updated);
      setShowNewInv(false);
      setActiveInv(inv);
      setTab('investigations');
    } catch(e) { alert('Error al crear investigación: '+e.message); }
    setSaving(false);
  }

  async function updateInvestigation(id, messages, summary) {
    const invs = proj.investigations.map(i=>i.id===id?{...i,messages,summary}:i);
    const updated = {...proj, investigations:invs};
    setProj(updated); onUpdate(updated);
    try { await onUpdateInv(id, messages, summary); } catch(e) { console.error(e); }
  }

  async function saveCalculation(title, type, prompt, result, sources) {
    try {
      const calc = await onCreateCalc(proj.id, title, type, prompt, result, sources);
      const updated = {...proj, calculations:[calc,...(proj.calculations||[])]};
      setProj(updated); onUpdate(updated);
      return calc;
    } catch(e) { alert('Error al guardar: '+e.message); }
  }

  const invs = proj.investigations||[];

  return (
    <div className="project-page">
      <div className="project-header">
        <div className="project-title-area">
          <div className="breadcrumb"><button onClick={onBack}>Proyectos</button><span>›</span><span>{proj.name}</span></div>
          <div className="project-page-title">{proj.name}</div>
          {proj.description&&<div className="project-desc">{proj.description}</div>}
        </div>
        <div style={{display:'flex',gap:'.5rem'}}>
          {tab==='investigations'&&<button className="btn btn-primary" onClick={()=>setShowNewInv(true)}>+ Nueva investigación</button>}
        </div>
      </div>
      <div className="tabs">
        <button className={`tab${tab==='investigations'?' active':''}`} onClick={()=>{setTab('investigations');setActiveInv(null);}}>
          Investigaciones ({invs.length})
        </button>
        <button className={`tab${tab==='calculations'?' active':''}`} onClick={()=>setTab('calculations')}>
          Calculaciones ({(proj.calculations||[]).length})
        </button>
      </div>
      <div className="tab-content">
        {tab==='investigations'&&(
          activeInv
            ? <InvestigationChat inv={activeInv} onBack={()=>setActiveInv(null)} onUpdate={updateInvestigation}/>
            : <>
                {invs.length===0
                  ? <div className="empty-state"><div className="big">🔬</div><p>Aún no hay investigaciones en este proyecto</p><button className="btn btn-primary" onClick={()=>setShowNewInv(true)}>+ Añadir primera investigación</button></div>
                  : <div className="inv-list">
                      {invs.map(inv=>(
                        <div key={inv.id} className="inv-item" onClick={()=>setActiveInv(inv)}>
                          <div className={`inv-status ${inv.messages?.length>1?'status-done':'status-wip'}`}/>
                          <div className="inv-item-main">
                            <div className="inv-topic">{inv.topic}</div>
                            <div className="inv-preview">{inv.summary||'Sin resumen aún'}</div>
                          </div>
                          <div className="inv-date">{fmt(inv.created_at)}</div>
                        </div>
                      ))}
                    </div>
                }
              </>
        )}
        {tab==='calculations'&&<CalculationsTab project={proj} onSaveCalc={saveCalculation}/>}
      </div>
      {showNewInv&&<NewInvestigationModal onClose={()=>setShowNewInv(false)} onCreate={createInvestigation} saving={saving}/>}
    </div>
  );
}

// ── DASHBOARD ──────────────────────────────────────────────────────────────────
function Dashboard({ user, projects, onNewProject, onSelectProject, onSignOut }) {
  return (
    <div className="dashboard">
      {!isConfigured&&<SetupNotice/>}
      <div className="page-header">
        <div>
          <div className="page-title">Mis <span>proyectos</span></div>
          <div style={{fontSize:'.62rem',color:'var(--muted)',marginTop:'.3rem'}}>Hola, {user?.email?.split('@')[0]||user?.name||'investigador'}</div>
        </div>
        <button className="btn btn-primary" onClick={onNewProject}>+ Nuevo proyecto</button>
      </div>
      {projects.length===0
        ? <div className="empty-state"><div className="big">📁</div><p>Crea tu primer proyecto de investigación</p><button className="btn btn-primary" onClick={onNewProject}>+ Crear proyecto</button></div>
        : <div className="projects-grid">
            {projects.map(p=>(
              <div key={p.id} className="project-card" onClick={()=>onSelectProject(p)}>
                <div className="project-card-header">
                  <div className="project-name">{p.name}</div>
                </div>
                {p.description&&<div className="project-meta">{p.description}</div>}
                <div className="project-meta" style={{marginBottom:'.6rem'}}>{fmt(p.created_at)}</div>
                <div className="project-stats">
                  <span className="stat-badge stat-inv">{(p.investigations||[]).length} invest.</span>
                  <span className="stat-badge stat-calc">{(p.calculations||[]).length} calc.</span>
                </div>
              </div>
            ))}
            <div className="new-project-card" onClick={onNewProject}>
              <span style={{fontSize:'1.5rem',opacity:.4}}>+</span>
              <span>Nuevo proyecto</span>
            </div>
          </div>
      }
    </div>
  );
}

// ── ROOT APP ──────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [projects, setProjects] = useState([]);
  const [activeProject, setActiveProject] = useState(null);
  const [showNewProject, setShowNewProject] = useState(false);
  const [demoMode, setDemoMode] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const [dataLoading, setDataLoading] = useState(false);
  const [dbError, setDbError] = useState(null);

  useEffect(()=>{
    if(!isConfigured){ setAuthLoading(false); return; }
    supabase.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user||null); setAuthLoading(false);
    });
    const {data:{subscription}} = supabase.auth.onAuthStateChange((_,s)=>{ setUser(s?.user||null); });
    return ()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(demoMode){ setProjects(DEMO_PROJECTS); setUser({email:'demo@researchlab.app',name:'Demo'}); }
  },[demoMode]);

  useEffect(()=>{
    if(!user||demoMode||!isConfigured) return;
    setDataLoading(true); setDbError(null);
    dbLoadProjects(user.id)
      .then(ps=>{ setProjects(ps); setDataLoading(false); })
      .catch(e=>{ setDbError(e.message); setDataLoading(false); });
  },[user, demoMode]);

  async function createProject(name, desc) {
    if(demoMode){
      const p={id:'p'+Date.now(),name,description:desc,created_at:new Date().toISOString(),investigations:[],calculations:[]};
      setProjects(ps=>[p,...ps]); setShowNewProject(false); setActiveProject(p); return;
    }
    try {
      const p = await dbCreateProject(user.id, name, desc);
      setProjects(ps=>[p,...ps]); setShowNewProject(false); setActiveProject(p);
    } catch(e){ setDbError(e.message); }
  }

  function updateProject(updated) {
    setProjects(ps=>ps.map(p=>p.id===updated.id?updated:p));
    setActiveProject(updated);
  }

  async function handleCreateInv(projectId, topic, messages) {
    if(demoMode) return {id:'i'+Date.now(),topic,summary:'Nueva investigación',messages,created_at:new Date().toISOString()};
    return await dbCreateInvestigation(user.id, projectId, topic, messages);
  }

  async function handleUpdateInv(invId, messages, summary) {
    if(demoMode||!isConfigured) return;
    try { await dbUpdateInvestigation(invId, messages, summary); }
    catch(e){ setDbError(e.message); }
  }

  async function handleCreateCalc(projectId, title, type, prompt, result, sources) {
    if(demoMode) return {id:'c'+Date.now(),title,type,prompt,result,sources,created_at:new Date().toISOString()};
    return await dbCreateCalculation(user.id, projectId, title, type, prompt, result, sources);
  }

  async function signOut() {
    if(demoMode){ setDemoMode(false); setUser(null); setProjects([]); setActiveProject(null); return; }
    if(isConfigured) await supabase.auth.signOut();
    setUser(null); setProjects([]); setActiveProject(null);
  }

  if(authLoading) return (
    <div style={{display:'grid',placeItems:'center',height:'100vh',gap:'.8rem'}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'.6rem'}}>
        <div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'1.4rem',letterSpacing:'-.03em'}}>Research<span style={{color:'var(--accent)'}}>Lab</span></div>
        <div style={{display:'flex',gap:'4px'}}><div className="dot"/><div className="dot"/><div className="dot"/></div>
      </div>
    </div>
  );
  if(!user&&!demoMode) return <AuthPage onDemoMode={()=>setDemoMode(true)}/>;

  return (
    <div className="app">
      <header className="header">
        <div className="logo">Research<span>Lab</span></div>
        <div className="header-right">
          {demoMode&&<span style={{fontSize:'.58rem',background:'rgba(212,130,15,.1)',color:'var(--amber)',border:'1px solid rgba(212,130,15,.25)',padding:'.2rem .5rem',borderRadius:2,letterSpacing:'.08em'}}>DEMO</span>}
          {activeProject&&<button className="btn btn-ghost" onClick={()=>setActiveProject(null)}>← Proyectos</button>}
          <div className="avatar" onClick={signOut} title="Cerrar sesión">
            {(user?.email?.[0]||user?.name?.[0]||'U').toUpperCase()}
          </div>
        </div>
      </header>
      {dbError&&(
        <div style={{background:'rgba(201,79,44,.08)',border:'1px solid rgba(201,79,44,.25)',color:'var(--accent)',padding:'.5rem 1.6rem',fontSize:'.65rem',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>⚠ Error de base de datos: {dbError}</span>
          <button onClick={()=>setDbError(null)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--accent)',fontSize:'1rem'}}>✕</button>
        </div>
      )}
      {dataLoading ? (
        <div style={{display:'grid',placeItems:'center',flex:1,color:'var(--muted)',fontSize:'.7rem',gap:'.5rem'}}>
          <div style={{display:'flex',gap:'4px'}}><div className="dot"/><div className="dot"/><div className="dot"/></div>
          <span>Cargando proyectos…</span>
        </div>
      ) : activeProject ? (
        <ProjectPage
          project={activeProject}
          onBack={()=>setActiveProject(null)}
          onUpdate={updateProject}
          onCreateInv={handleCreateInv}
          onUpdateInv={handleUpdateInv}
          onCreateCalc={handleCreateCalc}
        />
      ) : (
        <Dashboard user={user} projects={projects} onNewProject={()=>setShowNewProject(true)} onSelectProject={p=>setActiveProject(p)} onSignOut={signOut}/>
      )}
      {showNewProject&&<NewProjectModal onClose={()=>setShowNewProject(false)} onCreate={createProject}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
